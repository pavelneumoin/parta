# Локальная Postgres для разработки и тестирования.
#
# Запуск:
#   docker compose up -d
#   npx prisma migrate dev --name init   # (только первый раз)
#
# Подключение:
#   DATABASE_URL="postgresql://parta:parta@localhost:5432/parta?schema=public"
#   (поставьте в .env.local и поменяйте provider в schema.prisma на "postgresql")

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: parta
      POSTGRES_PASSWORD: parta
      POSTGRES_DB: parta
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parta -d parta"]
      interval: 5s
      timeout: 5s
      retries: 10

  # (опционально) pgAdmin для просмотра данных через браузер
  # pgadmin:
  #   image: dpage/pgadmin4
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@parta.local
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on: [db]

volumes:
  pg_data:
